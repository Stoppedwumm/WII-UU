name: Mac sound library

# Builds the macOS sound library (native/mac/wiiuu_audio.m, Objective-C, called from Java with JNI)
# for Apple Silicon and Intel on a Mac runner, checks that both load in a JVM and that starting a
# capture fails cleanly instead of crashing (CI Macs have no Screen Recording permission), then
# commits it as resources/mac/libwiiuu-audio.dylib when it changed, so it ships in the jar. The
# checks' results show as notes on the run.
on:
  push:
    paths: ["native/mac/**", "src/wiiuu/screen/MacAudio.java", ".github/workflows/mac-native.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: aarch64

      - name: Build (arm64 + x86_64)
        run: |
          chmod +x native/mac/build.sh
          native/mac/build.sh build/libwiiuu-audio.dylib
          javac --release 17 -d build/t src/wiiuu/screen/MacAudio.java
          echo "::notice title=Architectures::$(lipo -archs build/libwiiuu-audio.dylib)"

      - name: Load on Apple Silicon
        run: |
          out="$(java -cp build/t wiiuu.screen.MacAudio --check build/libwiiuu-audio.dylib)"
          echo "$out"
          echo "::notice title=Apple Silicon::$out"

      - name: Capture while system sounds play, each way (must not crash)
        run: |
          set +e
          for way in auto sck tap; do
            # play system sounds while it records, to see whether real sound comes through
            (sleep 4; for i in 1 2 3 4 5; do afplay /System/Library/Sounds/Glass.aiff; done) &
            WIIUU_MAC_AUDIO=$way perl -e 'alarm 15; exec @ARGV' java -cp build/t wiiuu.screen.MacAudio 48000 build/libwiiuu-audio.dylib > build/pcm.raw 2> build/err.txt
            code=$?
            wait
            bytes="$(wc -c < build/pcm.raw | tr -d ' ')"
            peak="$(python3 -c "import array; b=open('build/pcm.raw','rb').read(); a=array.array('h', b[:len(b)//2*2]); print(max((abs(x) for x in a), default=0))")"
            err="$(tr '\n' ' ' < build/err.txt)"
            echo "$way: exit code $code, $bytes bytes, loudest sample $peak of 32767: $err"
            echo "::notice title=Capture ($way)::exit code $code, $bytes bytes, loudest sample $peak of 32767: $err"
            # 0/1: ran or stopped with a message; 142: still capturing after 15 s (SIGALRM). A crash is 134 or 139.
            case "$code" in 0|1|142) ;; *) exit 1 ;; esac
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Load on Intel (Rosetta)
        run: |
          out="$(java -cp build/t wiiuu.screen.MacAudio --check build/libwiiuu-audio.dylib)"
          echo "$out"
          echo "::notice title=Intel::$out"

      - uses: actions/upload-artifact@v4
        with:
          name: libwiiuu-audio
          path: build/libwiiuu-audio.dylib
          if-no-files-found: error

      - name: Commit the library into resources/mac (when it changed)
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        run: |
          cp build/libwiiuu-audio.dylib resources/mac/libwiiuu-audio.dylib
          if [ -z "$(git status --porcelain resources/mac)" ]; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/mac/libwiiuu-audio.dylib
          git commit -m "Mac sound library built from native/mac/wiiuu_audio.m ($(git rev-parse --short HEAD))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
