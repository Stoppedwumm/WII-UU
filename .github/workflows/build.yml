name: Build

# Development branches are betas; versioned release branches, tags or explicit promotion publish stable releases.
# Each channel keeps its own feed/download, backed by immutable GitHub/optional archive assets.
# All PRs build/test artifacts, but never publish releases or deploy the website.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a beta or promote the current default-branch commit to stable
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  native-ds-startup:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - name: Test actual native DS frame path on Java 27
        shell: bash
        run: |
          mkdir -p build/native-startup
          find engine/src -name '*.java' > build/native-engine.txt
          javac --release 17 -d build/native-startup @build/native-engine.txt
          find engine/src-choccy -name '*.java' > build/native-helper.txt
          javac --release 22 -cp build/native-startup -d build/native-startup @build/native-helper.txt
          javac --release 17 -cp build/native-startup -d build/native-startup test/wiiuu/core/NativeStartupTest.java
          if [[ "$RUNNER_OS" == macOS ]]; then
            core=build/native-startup/melondsds_libretro.dylib
            clang -dynamiclib -o "$core" test/native/ds_startup_fixture.c
          else
            core=build/native-startup/melondsds_libretro.so
            gcc -shared -fPIC -o "$core" test/native/ds_startup_fixture.c
          fi
          java --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true -cp build/native-startup wiiuu.core.NativeStartupTest "$core"

  actions-installer-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Test build ZIP import
        shell: bash
        run: |
          mkdir -p build/installer-tests
          javac --release 17 -d build/installer-tests engine/src/wiiuu/core/Config.java engine/src/wiiuu/core/GameSystem.java src/wiiuu/core/Changelog.java src/wiiuu/core/Updater.java engine/src/wiiuu/core/BuildInfo.java engine/src/wiiuu/core/Version.java test/wiiuu/core/ActionsBuildTest.java test/wiiuu/core/BuildInfoTest.java test/wiiuu/core/VersionTest.java test/wiiuu/core/UpdateChannelsTest.java engine/src/wiiuu/core/MiniJson.java src/wiiuu/core/ReleaseArchive.java test/wiiuu/core/ReleaseArchiveTest.java src/wiiuu/core/PluginStore.java test/wiiuu/core/PluginStoreTest.java src/wiiuu/core/NativePluginSession.java test/wiiuu/core/NativePluginSessionTest.java test/wiiuu/core/UserProfilesTest.java
          cp -r resources/plugins build/installer-tests/plugins
          java -cp build/installer-tests wiiuu.core.NativePluginSessionTest
          java -cp build/installer-tests wiiuu.core.PluginStoreTest
          java -cp build/installer-tests wiiuu.core.ActionsBuildTest
          java -cp build/installer-tests wiiuu.core.BuildInfoTest
          java -cp build/installer-tests wiiuu.core.VersionTest
          java -Djava.awt.headless=true -cp build/installer-tests wiiuu.core.UserProfilesTest
          java --add-modules jdk.httpserver -cp build/installer-tests wiiuu.core.UpdateChannelsTest
          java --add-modules jdk.httpserver -cp build/installer-tests wiiuu.core.ReleaseArchiveTest
          python3 -m unittest discover -s tools/tests -p 'test_release*.py'
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | Out-String | Write-Error }

      - name: Test shared core manager
        shell: bash
        run: |
          find engine/src -name '*.java' > build/core-manager-sources.txt
          javac --release 17 -d build/installer-tests @build/core-manager-sources.txt test/wiiuu/core/CoreManagerTest.java
          java -Djava.awt.headless=true -cp build/installer-tests wiiuu.core.CoreManagerTest

      - name: Test native cloudflared bundle and relay boundary
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Windows/*) platform=windows-amd64; binary=cloudflared.exe ;;
            macOS/ARM64) platform=darwin-arm64; binary=cloudflared ;;
            macOS/*) platform=darwin-amd64; binary=cloudflared ;;
            Linux/*) platform=linux-amd64; binary=cloudflared ;;
          esac
          python3 tools/package-cloudflared.py "$platform"
          "build/cloudflared/$platform/$binary" --version
          javac --release 17 -d build/installer-tests src/wiiuu/net/CloudflaredRelay.java src/wiiuu/net/RelayGateway.java src/wiiuu/net/QrCode.java test/wiiuu/net/RelayTest.java
          java -Djava.awt.headless=true -cp build/installer-tests wiiuu.net.RelayTest

  build:
    concurrency:
      group: wiiuu-packaging-${{ github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))) && 'publish' || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Node archive server and JavaScript plugins
        run: node --test archive/test/*.test.mjs test/plugins/*.test.cjs

      - name: Test real plugin browser against local fixtures
        run: |
          mkdir -p build/plugin-host
          cp resources/plugins/host/package*.json build/plugin-host/
          npm ci --prefix build/plugin-host --no-audit --no-fund --engine-strict
          # Chromium's sandbox cannot initialize on restricted CI hosts. Only this local fixture disables it.
          build/plugin-host/node_modules/.bin/electron test/plugins/browser-smoke.cjs --no-sandbox --ozone-platform=headless --disable-gpu
          ELECTRON_RUN_AS_NODE=1 build/plugin-host/node_modules/.bin/electron --test test/plugins/native.test.cjs

      - name: Build jar and release zip (also copies it into docs/download and writes docs/version.json)
        id: version
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          chmod +x build.sh package.sh
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REQUESTED_CHANNEL" = stable ]; then
              [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || { echo "Stable promotion must run on the default branch" >&2; exit 1; }
              export WIIUU_BUILD_CHANNEL=stable
            else
              export WIIUU_BUILD_CHANNEL=beta
            fi
          fi
          # build-version.py validates tags against Main.VERSION; development/PR builds remain beta.
          ./package.sh
          v="$(python3 -c 'import json; print(json.load(open("build/version.json"))["releaseVersion"])')"
          channel="$(python3 -c 'import json; print(json.load(open("build/version.json"))["channel"])')"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and test the standalone UI library
        run: |
          ./ui-library/build.sh
          ui_version="$(cat ui-library/VERSION)"
          echo "UI_VERSION=$ui_version" >> "$GITHUB_ENV"
          ui_jar="build/ui-library/WII-UU-UI-$ui_version.jar"
          mkdir -p build/ui-example
          javac --release 17 -cp "$ui_jar" -d build/ui-example docs/support/ui-library/UiDemo.java docs/support/ui-library/ThemeDemo.java docs/support/ui-library/MenuDemo.java docs/support/ui-library/AnimatedDemo.java test/wiiuu/ui/UiLibraryTest.java test/wiiuu/ui/AnimatedUiTest.java test/wiiuu/ui/UiControlsTest.java docs/support/ui-library/ControlsDemo.java
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" UiDemo --snapshot build/ui-example/demo.png
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" ThemeDemo --snapshot build/ui-example/themes.png
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" wiiuu.ui.UiLibraryTest
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" MenuDemo --snapshot build/ui-example/menu-light.png
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" MenuDemo --snapshot build/ui-example/menu-dark.png --dark
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" wiiuu.ui.AnimatedUiTest
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" AnimatedDemo --snapshot build/ui-example/mascot.png
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" AnimatedDemo --snapshot build/ui-example/visualizer.png --visualizer
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" wiiuu.ui.UiControlsTest
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" ControlsDemo --snapshot build/ui-example/controls-light.png
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" ControlsDemo --snapshot build/ui-example/controls-dark.png --dark
          test -s build/ui-example/controls-light.png
          test -s build/ui-example/controls-dark.png
          test -f build/ui-library/api/wiiuu/ui/Ui.html
          test -f build/ui-library/api/wiiuu/ui/UiButton.html
          test -s build/ui-example/mascot.png
          test -s build/ui-example/visualizer.png
          test -f build/ui-library/api/wiiuu/ui/AnimatedMascot.html
          test -f build/ui-library/api/wiiuu/ui/AudioVisualizer.html
          test -s build/ui-example/menu-light.png
          test -s build/ui-example/menu-dark.png
          test -f build/ui-library/api/wiiuu/ui/MenuPainter.html
          test -s build/ui-example/themes.png
          test -f build/ui-library/api/wiiuu/ui/ThemeScript.html
          test -s build/ui-example/demo.png
          test -f build/ui-library/api/wiiuu/engine/GameScreen.html
          cp -R build/ui-library/api docs/support/ui-library/

      - name: Smoke test (render the menu headless)
        run: |
          java -Djava.awt.headless=true -jar build/wiiuu.jar --home "$RUNNER_TEMP/wiiuu" \
            --snapshot "$RUNNER_TEMP/menu.png" --snapshot-view home
          test -s "$RUNNER_TEMP/menu.png"
          java -jar build/ChoccyMilk.jar --help

      - name: Test activated plugin apps in the dock
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/ui/PluginDockTest.java test/wiiuu/ui/NativePluginScreenTest.java test/wiiuu/core/NativePluginBridgeTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.ui.PluginDockTest
          java --add-modules jdk.httpserver -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.ui.NativePluginScreenTest
          java -cp build/classes:build/tests wiiuu.core.NativePluginBridgeTest build/plugin-host/node_modules/electron/dist

      - name: Test USB backup, factory reset and restore
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/core/DemoDeviceTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.core.DemoDeviceTest

      - name: Test multi-user profiles and sign-out UI
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/core/UserProfilesTest.java test/wiiuu/ui/SignOutPowerTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.core.UserProfilesTest
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.ui.SignOutPowerTest

      - name: Test native Linux Wi-Fi list parsing
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/ui/LinuxNetworkPickerTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.ui.LinuxNetworkPickerTest

      - name: Test Choccy Milk dual screens and pointer input
        run: |
          javac --release 22 -cp build/classes -d build/tests test/wiiuu/screen/ChoccyDualScreenTest.java
          java --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.screen.ChoccyDualScreenTest

      - name: Test storage relocation and LAN migration
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/net/MigrationTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.net.MigrationTest

      - name: Test relay boundary and downloaded Linux helper
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/net/RelayTest.java test/wiiuu/net/RelayBundleTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.net.RelayTest
          java -Djava.awt.headless=true -cp build/wiiuu.jar:build/tests wiiuu.net.RelayBundleTest

      - name: Test standalone bindings and shared DS online options
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/core/ChoccySettingsTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.core.ChoccySettingsTest

      - name: Test GamePad screen and controller layouts
        run: |
          node test/web/screen-choices.cjs
          node test/web/controller-layouts.cjs

      - name: Check shell scripts
        run: bash -n install.sh emulators.sh build.sh package.sh docs/get.sh

      - name: Prepare easy-install artifact
        run: |
          mkdir -p build/actions-artifact
          unzip -q "dist/WII-UU-${{ env.VERSION }}.zip" -d build/actions-artifact

      - uses: actions/upload-artifact@v4
        with:
          name: WII-UU-${{ env.VERSION }}
          path: build/actions-artifact/WII-UU-${{ env.VERSION }}/
          if-no-files-found: error

      - name: Upload to optional archive service
        if: vars.WIIUU_ARCHIVE_URL != '' && github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')))
        env:
          ARCHIVE_TOKEN: ${{ secrets.WIIUU_ARCHIVE_TOKEN }}
          ARCHIVE_URL: ${{ vars.WIIUU_ARCHIVE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            node archive/client.mjs --url "$ARCHIVE_URL" --manifest build/release-feed/version.json \
              --asset "dist/WII-UU-$VERSION.zip" --asset CHANGELOG.md \
              --asset build/ChoccyMilk.jar --asset build/WII-UU-Cleanup.jar \
              --asset build/WII-UU-OEM-Creator.jar --asset build/WII-UU-Reactions.jar \
              --write-manifest build/release-feed/version.json
          fi

      - name: Publish versioned application release
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          flags=(--latest=false --prerelease)
          if [ "$CHANNEL" = stable ]; then flags=(--latest); fi
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" "dist/WII-UU-$VERSION.zip" build/release-feed/version.json \
              CHANGELOG.md build/WII-UU-Reactions.jar --target "$GITHUB_SHA" \
              --title "WII-UU $VERSION" --generate-notes "${flags[@]}"
          fi

      - name: Assemble stable and beta website channels from published releases
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > build/published-releases.json
          python3 tools/stage-release-site.py build/published-releases.json
          python3 -c 'import json; print("Stable update feed staged:", json.load(open("docs/version.json"))["version"])'
          python3 -c 'import json; print("Beta update feed staged:", json.load(open("docs/beta/version.json"))["version"])'

      - name: Package the website
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')))
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish the standalone UI library release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wiiuu-ui-v$UI_VERSION"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" \
              "build/ui-library/WII-UU-UI-$UI_VERSION.jar" \
              "build/ui-library/WII-UU-UI-$UI_VERSION-javadoc.jar" \
              "docs/support/ui-library/UiDemo.java" \
              "docs/support/ui-library/ThemeDemo.java" \
              "docs/support/ui-library/MenuDemo.java" \
              "docs/support/ui-library/AnimatedDemo.java" \
              "docs/support/ui-library/ControlsDemo.java" \
              --target "$GITHUB_SHA" --latest=false --title "WII-UU UI Library $UI_VERSION" \
              --notes "Standalone Java 17+ game screen renderer, display filters, theme scripting, menu palettes and backgrounds, shadows, vector icons, font caching and text layout, Cocoa/Milk painting and icons, reusable intro animation, animated mascots, audio spectrum analysis and visualization, themed Swing controls and app layouts, desktop theme detection and GamePad button types. See the [getting started guide](https://wiiuu.stoppedwumm.net/support/ui-library/) for setup and examples."
          fi


  pages:
    needs: build
    # A release/* build publishes the stable GitHub release in the build job.
    # Deploy its freshly staged stable feed AFTER that release exists.
    # Otherwise the default-branch deploy can win the race and leave /version.json one version behind.
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
