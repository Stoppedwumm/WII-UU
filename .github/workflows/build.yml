name: Build

# Builds the jar and the release zip on every push and pull request, and keeps the zip as a
# downloadable artifact.
# On the default branch it then publishes the website (docs/) to GitHub Pages with the freshly
# built zip in download/ and a matching version.json, so the site and "Check for updates" always
# offer the newest build. (Settings → Pages → Source must be "GitHub Actions".)
# Pushing a tag such as v1.3.0 also publishes a GitHub release with the zip.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  native-ds-startup:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - name: Test actual native DS frame path on Java 27
        shell: bash
        run: |
          mkdir -p build/native-startup
          find engine/src -name '*.java' > build/native-engine.txt
          javac --release 17 -d build/native-startup @build/native-engine.txt
          find engine/src-choccy -name '*.java' > build/native-helper.txt
          javac --release 22 -cp build/native-startup -d build/native-startup @build/native-helper.txt
          javac --release 17 -cp build/native-startup -d build/native-startup test/wiiuu/core/NativeStartupTest.java
          if [[ "$RUNNER_OS" == macOS ]]; then
            core=build/native-startup/melondsds_libretro.dylib
            clang -dynamiclib -o "$core" test/native/ds_startup_fixture.c
          else
            core=build/native-startup/melondsds_libretro.so
            gcc -shared -fPIC -o "$core" test/native/ds_startup_fixture.c
          fi
          java --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true -cp build/native-startup wiiuu.core.NativeStartupTest "$core"

  actions-installer-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Test build ZIP import
        shell: bash
        run: |
          mkdir -p build/installer-tests
          javac --release 17 -d build/installer-tests engine/src/wiiuu/core/Config.java engine/src/wiiuu/core/GameSystem.java src/wiiuu/core/Changelog.java src/wiiuu/core/Updater.java src/wiiuu/core/BuildInfo.java test/wiiuu/core/ActionsBuildTest.java test/wiiuu/core/BuildInfoTest.java
          java -cp build/installer-tests wiiuu.core.ActionsBuildTest
          java -cp build/installer-tests wiiuu.core.BuildInfoTest
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | Out-String | Write-Error }

      - name: Test shared core manager
        shell: bash
        run: |
          find engine/src -name '*.java' > build/core-manager-sources.txt
          javac --release 17 -d build/installer-tests @build/core-manager-sources.txt test/wiiuu/core/CoreManagerTest.java
          java -Djava.awt.headless=true -cp build/installer-tests wiiuu.core.CoreManagerTest

      - name: Test native cloudflared bundle and relay boundary
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Windows/*) platform=windows-amd64; binary=cloudflared.exe ;;
            macOS/ARM64) platform=darwin-arm64; binary=cloudflared ;;
            macOS/*) platform=darwin-amd64; binary=cloudflared ;;
            Linux/*) platform=linux-amd64; binary=cloudflared ;;
          esac
          python3 tools/package-cloudflared.py "$platform"
          "build/cloudflared/$platform/$binary" --version
          javac --release 17 -d build/installer-tests src/wiiuu/net/CloudflaredRelay.java src/wiiuu/net/RelayGateway.java src/wiiuu/net/QrCode.java test/wiiuu/net/RelayTest.java
          java -Djava.awt.headless=true -cp build/installer-tests wiiuu.net.RelayTest

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build jar and release zip (also copies it into docs/download and writes docs/version.json)
        id: version
        run: |
          chmod +x build.sh package.sh
          if [[ "$GITHUB_REF" == refs/tags/v* || ( "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ) ]]; then
            export WIIUU_BUILD_CHANNEL=release
          else
            export WIIUU_BUILD_CHANNEL=beta
          fi
          ./package.sh
          unzip -p build/wiiuu.jar wiiuu-build.properties | grep -Fx "channel=$WIIUU_BUILD_CHANNEL"
          v="$(grep -o 'VERSION = "[^"]*"' src/wiiuu/Main.java | cut -d'"' -f2)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and test the standalone UI library
        run: |
          ./ui-library/build.sh
          ui_version="$(cat ui-library/VERSION)"
          echo "UI_VERSION=$ui_version" >> "$GITHUB_ENV"
          ui_jar="build/ui-library/WII-UU-UI-$ui_version.jar"
          mkdir -p build/ui-example
          javac --release 17 -cp "$ui_jar" -d build/ui-example docs/support/ui-library/UiDemo.java
          java -Djava.awt.headless=true -cp "$ui_jar:build/ui-example" UiDemo --snapshot build/ui-example/demo.png
          test -s build/ui-example/demo.png
          test -f build/ui-library/api/wiiuu/engine/GameScreen.html
          cp -R build/ui-library/api docs/support/ui-library/

      - name: Smoke test (render the menu headless)
        run: |
          java -Djava.awt.headless=true -jar build/wiiuu.jar --home "$RUNNER_TEMP/wiiuu" \
            --snapshot "$RUNNER_TEMP/menu.png" --snapshot-view home
          test -s "$RUNNER_TEMP/menu.png"
          java -jar build/ChoccyMilk.jar --help

      - name: Test Choccy Milk dual screens and pointer input
        run: |
          javac --release 22 -cp build/classes -d build/tests test/wiiuu/screen/ChoccyDualScreenTest.java
          java --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.screen.ChoccyDualScreenTest

      - name: Test storage relocation and LAN migration
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/net/MigrationTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.net.MigrationTest

      - name: Test relay boundary and downloaded Linux helper
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/net/RelayTest.java test/wiiuu/net/RelayBundleTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.net.RelayTest
          java -Djava.awt.headless=true -cp build/wiiuu.jar:build/tests wiiuu.net.RelayBundleTest

      - name: Test standalone bindings and shared DS online options
        run: |
          javac --release 17 -cp build/classes -d build/tests test/wiiuu/core/ChoccySettingsTest.java
          java -Djava.awt.headless=true -cp build/classes:build/tests wiiuu.core.ChoccySettingsTest

      - name: Test GamePad screen and controller layouts
        run: |
          node test/web/screen-choices.cjs
          node test/web/controller-layouts.cjs

      - name: Check shell scripts
        run: bash -n install.sh emulators.sh build.sh package.sh docs/get.sh

      - name: Prepare easy-install artifact
        run: |
          mkdir -p build/actions-artifact
          unzip -q "dist/WII-UU-${{ env.VERSION }}.zip" -d build/actions-artifact

      - uses: actions/upload-artifact@v4
        with:
          name: WII-UU-${{ env.VERSION }}
          path: build/actions-artifact/WII-UU-${{ env.VERSION }}/
          if-no-files-found: error

      - name: Keep only the current zip on the site
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: find docs/download -name 'WII-UU-*.zip' ! -name "WII-UU-$VERSION.zip" ! -name 'WII-UU-latest.zip' -delete

      - name: Package the website
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish the standalone UI library release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wiiuu-ui-v$UI_VERSION"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" \
              "build/ui-library/WII-UU-UI-$UI_VERSION.jar" \
              "build/ui-library/WII-UU-UI-$UI_VERSION-javadoc.jar" \
              "docs/support/ui-library/UiDemo.java" \
              --target "$GITHUB_SHA" --latest=false --title "WII-UU UI Library $UI_VERSION" \
              --notes "Standalone Java 17+ game screen renderer, display filters, desktop theme detection and GamePad button types. See the [getting started guide](https://wiiuu.stoppedwumm.net/support/ui-library/) for setup and examples."
          fi

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/WII-UU-$VERSION.zip" \
            --title "WII-UU $VERSION" --generate-notes

  pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
