name: Build

# Builds the jar and the release zip on every push and pull request, and keeps the zip as a
# downloadable artifact.
# On the default branch it then publishes the website (docs/) to GitHub Pages with the freshly
# built zip in download/ and a matching version.json, so the site and "Check for updates" always
# offer the newest build. (Settings → Pages → Source must be "GitHub Actions".)
# Pushing a tag such as v1.3.0 also publishes a GitHub release with the zip.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build jar and release zip (also copies it into docs/download and writes docs/version.json)
        id: version
        run: |
          chmod +x build.sh package.sh
          ./package.sh
          v="$(grep -o 'VERSION = "[^"]*"' src/wiiuu/Main.java | cut -d'"' -f2)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Smoke test (render the menu headless)
        run: |
          java -Djava.awt.headless=true -jar build/wiiuu.jar --home "$RUNNER_TEMP/wiiuu" \
            --snapshot "$RUNNER_TEMP/menu.png" --snapshot-view home
          test -s "$RUNNER_TEMP/menu.png"

      - name: Check shell scripts
        run: bash -n install.sh emulators.sh build.sh package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WII-UU-${{ env.VERSION }}
          path: dist/WII-UU-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Keep only the current zip on the site
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: find docs/download -name 'WII-UU-*.zip' ! -name "WII-UU-$VERSION.zip" ! -name 'WII-UU-latest.zip' -delete

      - name: Package the website
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/WII-UU-$VERSION.zip" \
            --title "WII-UU $VERSION" --generate-notes

  pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
