name: Verify PR version

# Build runs on every pull request, including forks. This privileged follow-up
# reads source files through the API and never checks out or executes PR code.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  verify:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const path = 'src/wiiuu/Main.java';
            const statusContext = 'WII-UU / Version bump';
            // GitHub can omit workflow_run.pull_requests for fork PRs.
            const candidates = run.pull_requests?.length
              ? await Promise.all(run.pull_requests.map(({ number }) =>
                  github.rest.pulls.get({ ...repo, pull_number: number }).then(result => result.data)))
              : await github.paginate(github.rest.pulls.list, { ...repo, state: 'open', per_page: 100 });
            const pulls = candidates.filter(pr => pr.state === 'open' &&
              pr.head.sha === run.head_sha && pr.head.repo?.id === run.head_repository?.id);
            if (!pulls.length) return;

            async function version(owner, repo, ref) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (data.encoding !== 'base64') return null;
                const source = Buffer.from(data.content, 'base64').toString('utf8');
                const declarations = [...source.matchAll(/^\s*public static final String VERSION = "([^"]*)";\s*$/gm)];
                if (declarations.length !== 1) return null;
                const value = declarations[0][1];
                const part = '(0|[1-9][0-9]*)';
                if (!new RegExp('^' + part + '\\.' + part + '\\.' + part + '$').test(value)) return null;
                return value;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            function increased(base, head) {
              const before = base.split('.').map(BigInt);
              const after = head.split('.').map(BigInt);
              const firstChange = before.findIndex((value, index) => value !== after[index]);
              return firstChange >= 0 && after[firstChange] > before[firstChange];
            }

            const errors = [];
            for (const pr of pulls) {
              const { data: baseRef } = await github.rest.git.getRef({ ...repo, ref: 'heads/' + pr.base.ref });
              const [before, after] = await Promise.all([
                version(repo.owner, repo.repo, baseRef.object.sha),
                version(pr.head.repo.owner.login, pr.head.repo.name, pr.head.sha)
              ]);
              if (!before) throw new Error('Base branch has no valid WII-UU version.');
              if (after && increased(before, after)) continue;
              const message = after
                ? 'WII-UU version ' + after + ' must be higher than the target branch version ' + before + '.'
                : 'Set a valid WII-UU version higher than ' + before + ' in `' + path + '`.';
              errors.push({ pr, before, message });
            }
            await github.rest.repos.createCommitStatus({
              ...repo, sha: run.head_sha, context: statusContext,
              state: errors.length ? 'failure' : 'success',
              description: errors.length ? 'Increase WII-UU VERSION in src/wiiuu/Main.java' : 'WII-UU version increased',
              target_url: context.serverUrl + '/' + repo.owner + '/' + repo.repo + '/actions/runs/' + context.runId
            });
            for (const { pr, before, message } of errors) {
              const marker = '<!-- wiiuu-version-bump:' + pr.head.sha + ':' + before + ' -->';
              const reviews = await github.paginate(github.rest.pulls.listReviews,
                { ...repo, pull_number: pr.number, per_page: 100 });
              if (!reviews.some(review => review.user?.login === 'github-actions[bot]' &&
                  review.body?.includes(marker))) {
                await github.rest.pulls.createReview({
                  ...repo, pull_number: pr.number, commit_id: pr.head.sha, event: 'COMMENT',
                  body: marker + '\n' + message + ' Update `' + path + '` before merging.'
                });
              }
            }
            if (errors.length) core.setFailed(errors.map(error => error.message).join('\n'));
