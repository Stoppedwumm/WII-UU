<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WII-UU 3D intro</title>
<!--
  The WII-UU 3D intro, about 15 s: a game console and its GamePad turn into a TV and a phone, the
  TV wakes up to the WII-UU menu, the system tiles drop into it, then break into blocks that come
  together as the 3D WII-UU logo. Rendered frame by frame by render-intro.sh: window.seek(t)
  draws the moment t (seconds) with nothing carried between frames, so any frame can be drawn on
  its own. The console and GamePad are generic shapes, not any company's product or logo.

  Timeline (seconds), matched by the sounds in IntroAudio.java:
    0.4  the console's light comes on (boot chime)
    2.2  to 5.0 the console becomes a TV, the GamePad a phone
    5.0  the TV switches on to the menu; 5.6 to 7.5 the tiles land, one by one
    7.8  the selection cursor; 8.6 the tiles break into blocks
    10.6 the blocks become the logo (impact); 11.6 the light sweep, the tagline
-->
<style>
  @font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 900; src: url(fonts/inter-latin-900-normal.woff2); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #05070f; }
  canvas { display: block; }
  #tag { position: absolute; left: 0; right: 0; top: 842px; text-align: center; font: 800 46px Inter; color: #fff;
         letter-spacing: 0.01em; opacity: 0; text-shadow: 0 0 30px rgba(0,150,255,.45); }
  #url { position: absolute; left: 0; right: 0; top: 916px; text-align: center; font: 600 34px Inter; color: #6ed7ff; opacity: 0; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
<script type="importmap">
  { "imports": { "three": "./build-intro/node_modules/three/build/three.module.js",
                 "three/addons/": "./build-intro/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="tag">Your PC, a Wii U–style console &nbsp;·&nbsp; your phone, the GamePad</div>
<div id="url">wiiuu.stoppedwumm.net</div>
<div id="fade"></div>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W = 1920, H = 1080;
window.DURATION = 15;

// ---- helpers -------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = (x) => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a));
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

// ---- renderer, scene, camera ---------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);
scene.fog = new THREE.Fog(0x05070f, 30, 70);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 200);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.3, 0.5, 0.94);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// lights: a soft key from above front, a cool rim from behind, and a sweep light for the logo
const key = new THREE.SpotLight(0xffffff, 320, 80, 0.55, 0.6, 1.6);
key.position.set(-8, 18, 16);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x6fb8ff, 1.4);
rim.position.set(6, 10, -14);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0x8fb6ff, 0x101018, 0.35));
const sweep = new THREE.PointLight(0xffffff, 0, 30, 1.6);
scene.add(sweep);

// the floor: dark and a little glossy, with a soft blue pool of light
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64),
  new THREE.MeshStandardMaterial({ color: 0x0b0e1a, roughness: 0.32, metalness: 0.2 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const pool = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false,
  map: radialTexture("rgba(0,140,255,0.16)", "rgba(0,140,255,0)") }));
pool.rotation.x = -Math.PI / 2;
pool.position.y = 0.01;
scene.add(pool);

function radialTexture(inner, outer) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---- the console ---------------------------------------------------------------------------
const white = new THREE.MeshPhysicalMaterial({ color: 0xdfe3e9, roughness: 0.18, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08 });
const consoleGroup = new THREE.Group();
const consoleBody = new THREE.Mesh(new RoundedBoxGeometry(1, 1, 1, 6, 0.14), white.clone());
consoleBody.castShadow = consoleBody.receiveShadow = true;
consoleGroup.add(consoleBody);
const slot = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.035, 0.01), new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.6, transparent: true }));
const led = new THREE.Mesh(new THREE.CircleGeometry(0.035, 24), new THREE.MeshBasicMaterial({ color: 0x00b4ff, transparent: true }));
consoleGroup.add(slot, led);
scene.add(consoleGroup);
const CONSOLE = { pos: v3(0, 0.46, -1.2), size: v3(3.4, 0.9, 5.2) };

// the TV it becomes
const TV = { pos: v3(0, 6.0, -3), size: v3(16.4, 9.4, 0.5) };
const tvBody = new THREE.Mesh(new RoundedBoxGeometry(TV.size.x, TV.size.y, TV.size.z, 4, 0.22),
  new THREE.MeshPhysicalMaterial({ color: 0x15171d, roughness: 0.3, metalness: 0.3, clearcoat: 0.6 }));
tvBody.castShadow = tvBody.receiveShadow = true;
scene.add(tvBody);
const SCREEN = { w: 15.6, h: 8.78, z: TV.pos.z + TV.size.z / 2 + 0.005 };
const ui = makeUiCanvas();
const uiTex = new THREE.CanvasTexture(ui.canvas);
uiTex.colorSpace = THREE.SRGBColorSpace;
uiTex.anisotropy = 8;
const screenMat = new THREE.MeshBasicMaterial({ map: uiTex, toneMapped: false, color: 0x000000 });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN.w, SCREEN.h), screenMat);
screen.position.set(0, 0, TV.size.z / 2 + 0.005);
tvBody.add(screen);
const powerLine = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN.w, SCREEN.h), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, toneMapped: false }));
powerLine.position.set(0, 0, TV.size.z / 2 + 0.01);
tvBody.add(powerLine);
const stand = new THREE.Group();
const neck = new THREE.Mesh(new RoundedBoxGeometry(1.3, 1.25, 0.35, 3, 0.08), tvBody.material);
neck.position.y = 0.7;
const base = new THREE.Mesh(new RoundedBoxGeometry(6, 0.14, 2.4, 3, 0.07), tvBody.material);
base.position.y = 0.07;
neck.castShadow = base.castShadow = base.receiveShadow = true;
stand.add(neck, base);
stand.position.set(0, 0, TV.pos.z);
scene.add(stand);

// ---- the GamePad and the phone it becomes --------------------------------------------------
const PAD = { pos: v3(2.6, 0.95, 2.9), rot: v3(-1.05, 0, 0), size: v3(3.1, 1.6, 0.28) };
const PHONE = { pos: v3(7.1, 3.0, 4.6), rot: v3(-0.06, -0.42, 0.04), size: v3(3.3, 1.58, 0.14) };
const padGroup = new THREE.Group();
const padBody = new THREE.Mesh(new RoundedBoxGeometry(PAD.size.x, PAD.size.y, PAD.size.z, 6, 0.13), white.clone());
padBody.castShadow = true;
padGroup.add(padBody);
const phoneBody = new THREE.Mesh(new RoundedBoxGeometry(PHONE.size.x, PHONE.size.y, PHONE.size.z, 6, 0.16),
  new THREE.MeshPhysicalMaterial({ color: 0x111317, roughness: 0.25, metalness: 0.5, clearcoat: 1 }));
phoneBody.castShadow = true;
padGroup.add(phoneBody);
// the pad's screen grows into the phone's display
let padLoaded;
const padReady = new Promise((ok) => { padLoaded = ok; });
const gamepadTex = new THREE.TextureLoader().load("../docs/gamepad.png", () => padLoaded(), undefined, () => padLoaded());
gamepadTex.colorSpace = THREE.SRGBColorSpace;
const padScreen = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x0a1626, toneMapped: false }));
padGroup.add(padScreen);
const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(PHONE.size.x - 0.16, PHONE.size.y - 0.14),
  new THREE.MeshBasicMaterial({ map: gamepadTex, toneMapped: false, transparent: true, opacity: 0 }));
padGroup.add(phoneScreen);
// sticks, a cross pad and four buttons
const darkPlastic = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.45 });
const controls = new THREE.Group();
for (const x of [-1.22, 1.22]) {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.16, 32), darkPlastic);
  s.rotation.x = Math.PI / 2; s.position.set(x, 0.42, 0.2); controls.add(s);
}
for (const [w, h] of [[0.36, 0.12], [0.12, 0.36]]) {
  const d = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), darkPlastic);
  d.position.set(-1.22, -0.2, 0.17); controls.add(d);
}
for (const [x, y] of [[1.22, 0], [1.22, -0.36], [1.04, -0.18], [1.4, -0.18]]) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 12), darkPlastic);
  b.position.set(x, y - 0.02, 0.15); controls.add(b);
}
padGroup.add(controls);
scene.add(padGroup);

// ---- the menu on the TV --------------------------------------------------------------------
const SYSTEMS = [
  ["NES", "Nintendo Entertainment System", "#E60012"], ["SNES", "Super Nintendo", "#5C4B9E"], ["N64", "Nintendo 64", "#1A9E3F"],
  ["GBA", "Game Boy Advance", "#4B3FA0"], ["GCN", "Nintendo GameCube", "#6A5ACD"], ["DS", "Nintendo DS", "#7A7A7A"],
  ["Wii", "Wii", "#33B5E5"], ["3DS", "Nintendo 3DS", "#CE181E"], ["Wii U", "Wii U", "#009AC7"],
  ["Switch", "Nintendo Switch", "#E60012"], ["MD", "Sega Genesis / Mega Drive", "#222222"], ["PS2", "PlayStation 2", "#1C3F94"]];
const GRID = { cols: 4, rows: 3, tw: 330, th: 230, gap: 30, x0: 255, y0: 150 };
function slotPx(i) { const c = i % GRID.cols, r = Math.floor(i / GRID.cols); return [GRID.x0 + c * (GRID.tw + GRID.gap), GRID.y0 + r * (GRID.th + GRID.gap)]; }
function pxToWorld(px, py) { return v3(TV.pos.x + (px / 1920 - 0.5) * SCREEN.w, TV.pos.y - (py / 1080 - 0.5) * SCREEN.h, SCREEN.z); }

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function makeUiCanvas() {
  const c = document.createElement("canvas"); c.width = 1920; c.height = 1080;
  return { canvas: c, draw(dim) {
    const g = c.getContext("2d");
    const bg = g.createLinearGradient(0, 0, 0, 1080); bg.addColorStop(0, "#F7F8FA"); bg.addColorStop(1, "#E2E6EA");
    g.fillStyle = bg; g.fillRect(0, 0, 1920, 1080);
    g.fillStyle = "rgba(0,0,0,0.035)"; for (let y = 0; y < 1080; y += 6) g.fillRect(0, y, 1920, 2);
    // top bar: the brand, the page, the clock
    g.fillStyle = "#fff"; roundRect(g, 40, 30, 330, 74, 37); g.fill();
    g.font = "900 40px Inter"; g.fillStyle = "#3C4043"; g.fillText("WII-", 76, 81);
    g.fillStyle = "#00A8E8"; g.fillText("UU", 76 + g.measureText("WII-").width, 81);
    g.font = "600 30px Inter"; g.fillStyle = "#8A9099"; g.fillText("|  Home", 214, 79);
    g.fillStyle = "#fff"; roundRect(g, 1560, 30, 320, 74, 37); g.fill();
    g.font = "800 40px Inter"; g.fillStyle = "#3C4043"; g.fillText("12:00", 1600, 81);
    g.font = "600 28px Inter"; g.fillStyle = "#8A9099"; g.fillText("GamePad 1", 1720, 79);
    // the empty places the tiles land in
    for (let i = 0; i < 12; i++) { const [x, y] = slotPx(i); g.strokeStyle = "rgba(0,0,0,0.07)"; g.lineWidth = 3; roundRect(g, x, y, GRID.tw, GRID.th, 26); g.stroke(); }
    // the dock
    g.fillStyle = "#fff"; roundRect(g, 460, 950, 1000, 96, 48); g.fill();
    g.font = "600 32px Inter"; g.fillStyle = "#6B7178";
    ["GamePad", "Settings", "Refresh", "Power"].forEach((s, k) => { const w = g.measureText(s).width; g.fillText(s, 585 + k * 250 - w / 2, 1009); });
    if (dim > 0) { g.fillStyle = `rgba(4,6,16,${dim})`; g.fillRect(0, 0, 1920, 1080); }
  } };
}

function tileTexture([short, name, color]) {
  const c = document.createElement("canvas"); c.width = 660; c.height = 460;
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, 660, 460);
  g.fillStyle = color; roundRect(g, 0, 0, 660, 110, [0, 0, 0, 0]); g.fill();
  const shade = g.createLinearGradient(0, 0, 0, 110); shade.addColorStop(0, "rgba(255,255,255,0.18)"); shade.addColorStop(1, "rgba(0,0,0,0.08)");
  g.fillStyle = shade; g.fillRect(0, 0, 660, 110);
  g.fillStyle = color; g.font = `900 ${short.length > 4 ? 120 : 150}px Inter`;
  const w = g.measureText(short).width; g.fillText(short, 330 - w / 2, 315);
  g.font = "600 34px Inter"; g.fillStyle = "#8A9099";
  const n = g.measureText(name).width; g.fillText(name, 330 - Math.min(n, 600) / 2, 395, 600);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

const TILE = { w: GRID.tw / 1920 * SCREEN.w, h: GRID.th / 1080 * SCREEN.h, d: 0.2 };
const tileGeo = new RoundedBoxGeometry(TILE.w, TILE.h, TILE.d, 4, 0.12);
const tiles = SYSTEMS.map((sys, i) => {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(tileGeo, new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.35, clearcoat: 0.6, transparent: true }));
  body.castShadow = true;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(TILE.w - 0.16, TILE.h - 0.16),
    new THREE.MeshBasicMaterial({ map: tileTexture(sys), toneMapped: false, transparent: true }));
  face.position.z = TILE.d / 2 + 0.003;
  grp.add(body, face);
  const [px, py] = slotPx(i);
  const home = pxToWorld(px + GRID.tw / 2, py + GRID.th / 2);
  home.z += TILE.d / 2 + 0.02;
  const r = rng(100 + i);
  grp.userData = { home, from: v3(home.x + (r() - 0.5) * 6, home.y + 10 + r() * 4, home.z + 7 + r() * 5),
    spin: v3((r() - 0.5) * 3, (r() - 0.5) * 3, (r() - 0.5) * 2), color: new THREE.Color(sys[2]) };
  scene.add(grp);
  return grp;
});
// order of landing: across the grid diagonally
const landOrder = [...tiles.keys()].sort((a, b) => ((a % 4) + Math.floor(a / 4)) - ((b % 4) + Math.floor(b / 4)) || a - b);
const LAND0 = 5.6, LAND_STEP = 0.17, FALL = 0.55;
const landAt = (i) => LAND0 + landOrder.indexOf(i) * LAND_STEP;

// the Wii U-style selection outline
const cursor = new THREE.Mesh(new THREE.PlaneGeometry(TILE.w + 0.34, TILE.h + 0.34),
  new THREE.MeshBasicMaterial({ map: outlineTexture(), transparent: true, toneMapped: false, depthWrite: false }));
scene.add(cursor);
function outlineTexture() {
  const c = document.createElement("canvas"); c.width = 720; c.height = 520; const g = c.getContext("2d");
  g.shadowColor = "rgba(0,168,232,0.9)"; g.shadowBlur = 24; g.strokeStyle = "#00A8E8"; g.lineWidth = 14;
  roundRect(g, 26, 26, 668, 468, 44); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---- the logo, and the blocks it forms from ------------------------------------------------
const logoData = await (await fetch("build-intro/logo.json")).json();
const LOGO = { width: 9.6, pos: v3(0, 6.1, 1.6) };
const unit = LOGO.width / logoData.width;
const logoGroup = new THREE.Group();
const blueMat = new THREE.MeshPhysicalMaterial({ color: 0x00a8e8, roughness: 0.2, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true });
const whiteMat = new THREE.MeshPhysicalMaterial({ color: 0xe9edf3, roughness: 0.2, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true });
for (const [d, mat] of [[logoData.left, whiteMat], [logoData.right, blueMat]]) {
  const svg = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`);
  const shapes = svg.paths.flatMap((p) => SVGLoader.createShapes(p));
  const geo = new THREE.ExtrudeGeometry(shapes, { depth: 46, bevelEnabled: true, bevelThickness: 5, bevelSize: 3.2, bevelSegments: 4, curveSegments: 10 });
  geo.translate(0, 0, -23);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  logoGroup.add(mesh);
}
logoGroup.scale.set(unit, -unit, unit);              // the path has y down
const logoHolder = new THREE.Group();
logoHolder.add(logoGroup);
logoHolder.position.copy(LOGO.pos);
scene.add(logoHolder);

// blocks: points inside the letters, each starting on one of the tiles
const N = 1100;
const targets = sampleLogo(N);
const blocks = new THREE.InstancedMesh(new RoundedBoxGeometry(1, 1, 1, 2, 0.12),
  new THREE.MeshPhysicalMaterial({ roughness: 0.3, clearcoat: 0.8 }), N);
blocks.castShadow = true;
const blockData = [];
{
  const r = rng(7);
  for (let k = 0; k < N; k++) {
    const tile = k % 12;
    blockData.push({ tile, u: r() - 0.5, v: r() - 0.5, delay: r() * 0.5, arc: 2 + r() * 4, size: 0.2 + r() * 0.09,
      spin: v3((r() - 0.5) * 10, (r() - 0.5) * 10, (r() - 0.5) * 10), blue: targets[k].blue, white: r() < 0.55 });
    blocks.setColorAt(k, new THREE.Color(1, 1, 1));
  }
}
scene.add(blocks);

function sampleLogo(n) {
  const c = document.createElement("canvas"), s = 1100 / logoData.width;
  c.width = 1100; c.height = Math.ceil(logoData.height * s) + 20;
  const g = c.getContext("2d");
  g.translate(550, c.height / 2); g.scale(s, s);
  g.fillStyle = "#f00"; g.fill(new Path2D(logoData.left));
  g.fillStyle = "#00f"; g.fill(new Path2D(logoData.right));
  const img = g.getImageData(0, 0, c.width, c.height).data, inside = [];
  for (let y = 0; y < c.height; y += 2) for (let x = 0; x < c.width; x += 2) {
    const i = (y * c.width + x) * 4;
    if (img[i + 3] > 200) inside.push([x, y, img[i + 2] > 128]);
  }
  const r = rng(3), out = [];
  for (let k = 0; k < n; k++) {
    const [x, y, blue] = inside[Math.floor(r() * inside.length)];
    out.push({ p: v3((x - 550) / s * unit, -(y - c.height / 2) / s * unit, (r() - 0.5) * 46 * unit * 0.8), blue });
  }
  return out;
}

// ---- sparkles: particles that come from the transformations ---------------------------------
const SPARKS = 700;
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(SPARKS * 3), 3));
sparkGeo.setAttribute("alpha", new THREE.BufferAttribute(new Float32Array(SPARKS), 1));
const sparkMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { size: { value: 46 } },
  vertexShader: `attribute float alpha; varying float vA; uniform float size;
    void main() { vA = alpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = size / -mv.z * (0.6 + alpha); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vA; void main() { float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d) * vA;
    gl_FragColor = vec4(vec3(0.55, 0.85, 1.0) * a + vec3(a * a), a); }` });
const sparks = new THREE.Points(sparkGeo, sparkMat);
scene.add(sparks);
const sparkSeed = []; { const r = rng(11); for (let i = 0; i < SPARKS; i++) sparkSeed.push([r(), r(), r(), r(), r()]); }

function drawSparks(t) {
  const pos = sparkGeo.attributes.position.array, al = sparkGeo.attributes.alpha.array;
  for (let i = 0; i < SPARKS; i++) {
    const [a, b, c, d, e] = sparkSeed[i];
    al[i] = 0;
    // bursts: the transformation (2.2-5.2) around the console and the pad; landings; the logo forming
    let born, origin, spread, life = 1.1;
    if (i < 380) { born = 2.2 + a * 3.0; origin = i % 2 ? consoleBody.getWorldPosition(v3()) : padGroup.position; spread = i % 2 ? 4.5 : 2.2; }
    else if (i < 560) { const k = (i - 380) % 12; born = landAt(k) + FALL + b * 0.15; origin = tiles[k].userData.home; spread = 1.6; life = 0.7; }
    else { born = 10.45 + a * 0.5; origin = LOGO.pos; spread = 6.5; life = 1.4; }
    const age = t - born;
    if (age < 0 || age > life) { pos[i * 3 + 1] = -100; continue; }
    const k = age / life, ang = b * Math.PI * 2, up = c - 0.3;
    const out = spread * (0.3 + 0.7 * d) * easeOut(k * 1.4);
    pos[i * 3] = origin.x + Math.cos(ang) * out;
    pos[i * 3 + 1] = origin.y + up * spread * 0.6 * easeOut(k) + 0.8 * k;
    pos[i * 3 + 2] = origin.z + Math.sin(ang) * out * 0.6 + 0.5;
    al[i] = (1 - k) * (0.5 + 0.5 * e);
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.alpha.needsUpdate = true;
}

// ---- the moment t ----------------------------------------------------------------------------
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
let lastDim = -1;

window.seek = (t) => {
  // -- camera: close on the console, out to the TV, toward the logo
  const out = easeInOut(span(t, 2.0, 5.2)), push = easeInOut(span(t, 8.6, 12));
  const orbit = 0.45 * (1 - easeOut(span(t, 0, 3.2)));
  const near = v3(Math.sin(orbit) * 12, 5.2, Math.cos(orbit) * 12 + 0.5), far = v3(0, 5.8, 23.5), close = v3(0, 6.0, 19.5);
  camera.position.copy(near).lerp(far, out).lerp(close, push);
  const look = v3(0, 0.6, 0).lerp(v3(0.8, 5.4, -1), out).lerp(v3(0.6, 5.7, 0), push);
  camera.lookAt(look);
  key.target.position.copy(look);

  // -- the console: light on at 0.4, spins and stretches toward the TV, which takes over at m = 0.5
  const m = easeInOut(span(t, 2.2, 5.0));
  const ledOn = t > 0.4 ? 0.6 + 0.4 * Math.sin(t * 3) : 0.05;
  led.material.opacity = (1 - span(m, 0, 0.25)) * ledOn;
  slot.material.opacity = 1 - span(m, 0, 0.25);
  const half = v3(8.5, 5, 2.4), midPos = v3(0, 3.4, -2.2);
  const cm = span(m, 0, 0.5);
  consoleGroup.visible = m < 0.5;
  consoleBody.scale.copy(CONSOLE.size).lerp(half, easeIn(cm));
  consoleGroup.position.copy(CONSOLE.pos).lerp(midPos, cm);
  consoleGroup.rotation.set(0, cm * Math.PI * 1.5, 0);
  slot.position.set(0, 0.05, CONSOLE.size.z / 2 + 0.006);
  led.position.set(1.35, -0.18, CONSOLE.size.z / 2 + 0.008);
  slot.scale.setScalar(1);
  consoleBody.material.color.set(0xdfe3e9).lerp(new THREE.Color(0x15171d), smooth(span(m, 0.25, 0.5)));
  const tm = span(m, 0.5, 1);
  tvBody.visible = m >= 0.5;
  const tvScale = v3(half.x / TV.size.x, half.y / TV.size.y, half.z / TV.size.z).lerp(v3(1, 1, 1), easeOut(tm));
  tvBody.scale.copy(tvScale);
  tvBody.position.copy(midPos).lerp(TV.pos, easeOut(tm));
  tvBody.rotation.y = (1 - easeOut(tm)) * Math.PI * 0.5;
  stand.scale.set(1, smooth(span(m, 0.75, 1)), 1);
  stand.visible = m > 0.75;

  // -- the TV wakes: a white line opens to the menu (5.0-5.4)
  const on = span(t, 5.0, 5.35);
  powerLine.visible = t >= 5.0 && t < 5.55;
  powerLine.scale.set(lerp(0.02, 1, smooth(span(t, 5.0, 5.12))), lerp(0.004, 1, easeOut(span(t, 5.1, 5.35))), 1);
  powerLine.material.opacity = 1 - span(t, 5.3, 5.55);
  const dim = 0.86 * smooth(span(t, 8.9, 10.2));
  if (Math.abs(dim - lastDim) > 0.004) { ui.draw(dim); uiTex.needsUpdate = true; lastDim = dim; }
  screenMat.color.setScalar(on * 0.8);

  // -- the pad becomes a phone; its screen shows the GamePad
  const p = m;
  padGroup.position.copy(PAD.pos).lerp(PHONE.pos, easeInOut(p));
  padGroup.rotation.set(lerp(PAD.rot.x, PHONE.rot.x, easeInOut(p)), lerp(0, PHONE.rot.y, easeInOut(p)) + Math.sin(p * Math.PI) * 1.2, PHONE.rot.z * p);
  padGroup.position.y += Math.sin(p * Math.PI) * 1.5 + (t > 5 ? 0.08 * Math.sin(t * 1.6) : 0);
  padBody.visible = p < 0.5;
  phoneBody.visible = p >= 0.5;
  padBody.scale.copy(v3(1, 1, 1).lerp(v3(PHONE.size.x / PAD.size.x * 1.05, PHONE.size.y / PAD.size.y, 0.6), span(p, 0, 0.5)));
  padBody.material.color.set(0xdfe3e9).lerp(new THREE.Color(0x111317), smooth(span(p, 0.2, 0.5)));
  phoneBody.scale.copy(v3(1.05, 1, 1.6).lerp(v3(1, 1, 1), span(p, 0.5, 1)));
  controls.scale.setScalar(1 - smooth(span(p, 0, 0.35)));
  controls.visible = p < 0.35;
  const sw = lerp(1.55, PHONE.size.x - 0.16, smooth(span(p, 0.3, 0.9))), sh = lerp(0.88, PHONE.size.y - 0.14, smooth(span(p, 0.3, 0.9)));
  padScreen.scale.set(sw, sh, 1);
  padScreen.position.z = lerp(PAD.size.z / 2 + 0.004, PHONE.size.z / 2 + 0.004, span(p, 0.4, 0.6));
  padScreen.material.color.set(0x0a1626).lerp(new THREE.Color(0x103a66), 0.4 + 0.3 * Math.sin(t * 2));
  phoneScreen.position.z = PHONE.size.z / 2 + 0.006;
  phoneScreen.material.opacity = smooth(span(t, 5.15, 5.6));

  // -- the tiles fall into their places (5.6-7.5), then break into blocks at 8.6
  const breakT = 8.6;
  for (let i = 0; i < 12; i++) {
    const tile = tiles[i], d = tile.userData, a = landAt(i);
    const k = span(t, a, a + FALL);
    tile.visible = t >= a && t < breakT + 0.25;
    const fall = easeIn(k);
    tile.position.copy(d.from).lerp(d.home, fall);
    tile.rotation.set(d.spin.x * (1 - k), d.spin.y * (1 - k), d.spin.z * (1 - k));
    // squash on landing
    const after = t - (a + FALL), squash = after > 0 && after < 0.35 ? Math.sin(after / 0.35 * Math.PI) * Math.exp(-after * 6) : 0;
    tile.scale.set(1 + 0.08 * squash, 1 + 0.08 * squash, 1 - 0.5 * squash);
    // on the break, the tile lifts and flashes away into blocks
    const lift = span(t, breakT, breakT + 0.25);
    if (lift > 0) { tile.position.z += lift * 1.5; tile.scale.multiplyScalar(1 - 0.3 * lift); }
    for (const c of tile.children) c.material.opacity = 1 - lift;
  }
  const sel = smooth(span(t, 7.8, 8.05)) * (1 - span(t, breakT, breakT + 0.15));
  cursor.visible = sel > 0.01;
  const h0 = tiles[0].userData.home;
  cursor.position.set(h0.x, h0.y, h0.z + TILE.d / 2 + 0.03);
  cursor.scale.setScalar(1.08 - 0.04 * sel + 0.015 * Math.sin(t * 6));
  cursor.material.opacity = sel;
  if (sel > 0.01) tiles[0].position.z += 0.15 * sel;

  // -- blocks fly from the tiles into the letters (8.6-10.6); the solid logo takes over (10.4-10.9)
  const form = smooth(span(t, 10.35, 10.85));
  blocks.visible = t >= breakT && t < 10.95;
  if (blocks.visible) {
    for (let k = 0; k < N; k++) {
      const b = blockData[k], tile = tiles[b.tile].userData;
      const start = v3(tile.home.x + b.u * TILE.w, tile.home.y + b.v * TILE.h, tile.home.z + 0.3);
      const goal = targets[k].p.clone().add(LOGO.pos);
      const q = easeInOut(span(t, breakT + b.delay, breakT + b.delay + 1.35));
      const pos = start.clone().lerp(goal, q);
      pos.z += Math.sin(q * Math.PI) * b.arc;
      pos.y += Math.sin(q * Math.PI) * b.arc * 0.35;
      const s = b.size * (q < 1 ? 1 : 1) * (1 - form);
      tmpE.set(b.spin.x * (1 - q), b.spin.y * (1 - q), b.spin.z * (1 - q));
      tmpQ.setFromEuler(tmpE);
      tmpM.compose(pos, tmpQ, v3(s, s, s));
      blocks.setMatrixAt(k, tmpM);
      // tile colours at first, the logo's colours on arrival
      const from = tiles[b.tile].userData.color, to = new THREE.Color(b.blue ? 0x00a8e8 : 0xf4f6fa);
      blocks.setColorAt(k, (b.white && q < 0.5 ? new THREE.Color(0xffffff) : from.clone()).lerp(to, smooth(span(q, 0.35, 0.9))));
    }
    blocks.instanceMatrix.needsUpdate = true;
    blocks.instanceColor.needsUpdate = true;
  }
  logoHolder.visible = t >= 10.3;
  whiteMat.opacity = blueMat.opacity = form;
  whiteMat.transparent = blueMat.transparent = form < 0.999;
  const hero = t - 10.6;
  logoHolder.rotation.set(-0.06 + 0.04 * Math.sin(hero * 0.8), 0.14 * Math.sin(hero * 0.55) * smooth(span(t, 10.9, 12)), 0);
  logoHolder.position.copy(LOGO.pos);
  logoHolder.position.y += 0.12 * Math.sin(hero * 1.1) * smooth(span(t, 10.9, 12));
  const punch = t > 10.6 ? Math.exp(-(t - 10.6) * 7) : 0;
  logoHolder.scale.setScalar(1 + 0.06 * punch);

  // -- the light sweep across the logo (11.6-13)
  const sw2 = span(t, 11.5, 13.2);
  sweep.intensity = sw2 > 0 && sw2 < 1 ? 110 * Math.sin(sw2 * Math.PI) : 0;
  sweep.position.set(lerp(-9, 9, sw2), LOGO.pos.y + 1.5, LOGO.pos.z + 3.5);
  bloom.strength = 0.3 + 0.9 * punch + 0.3 * (t > 5 && t < 5.5 ? 1 - span(t, 5.1, 5.5) : 0);

  drawSparks(t);

  // -- words and the end
  document.getElementById("tag").style.opacity = smooth(span(t, 11.8, 12.4));
  document.getElementById("tag").style.transform = `translateY(${18 * (1 - easeOut(span(t, 11.8, 12.4)))}px)`;
  document.getElementById("url").style.opacity = smooth(span(t, 12.3, 12.9));
  document.getElementById("fade").style.opacity = smooth(span(t, 14.3, 15));

  composer.render();
};

await document.fonts.load("900 40px Inter");
await document.fonts.load("800 40px Inter");
await document.fonts.load("600 40px Inter");
// the tile faces and the menu were drawn before the fonts were ready: draw them again
tiles.forEach((tile, i) => { const f = tile.children[1].material; f.map = tileTexture(SYSTEMS[i]); f.needsUpdate = true; });
ui.draw(0); uiTex.needsUpdate = true; lastDim = 0;
await padReady;
window.seek(0);
window.READY = true;
if (!new URLSearchParams(location.search).has("render")) {
  const start = performance.now();
  const loop = () => { window.seek(((performance.now() - start) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
